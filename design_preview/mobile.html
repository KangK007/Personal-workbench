<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>移动端 · DESIGN V2 预览</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
  body { display: flex; flex-direction: column; }
  .stage { flex: 1; display: flex; gap: 40px; justify-content: center; align-items: flex-start; padding: 44px 24px 70px; flex-wrap: wrap; }
  .phone-col { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .phone-label { font-size: 12.5px; color: var(--ink-muted); }

  /* 手机框架 */
  .phone {
    width: 390px; height: 780px; border-radius: 28px;
    border: 1px solid var(--panel-border); box-shadow: var(--raised-shadow);
    background: var(--canvas); overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  .phone .notch { height: 26px; flex: none; display: flex; align-items: center; justify-content: center; }
  .phone .notch .pill-shape { width: 110px; height: 18px; border-radius: 9px; background: var(--ink); opacity: .9; }

  /* 移动 AppBar：实色 + 底部 divider */
  .m-appbar {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--divider);
  }
  .m-appbar .bar { width: 3px; height: 22px; border-radius: 2px; background: var(--primary); }
  .m-appbar .t { flex: 1; }
  .m-appbar .t b { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; display: block; line-height: 1.2; }
  .m-appbar .t span { font-size: 11px; color: var(--ink-muted); }

  .m-body { flex: 1; overflow-y: auto; padding: 14px; }

  /* 底部导航：实色 surface + 顶缘 divider */
  .m-nav {
    flex: none; display: flex; background: var(--surface);
    border-top: 1px solid var(--divider); padding: 8px 6px calc(10px + 6px);
  }
  .m-nav .item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; color: var(--ink-muted); position: relative; }
  .m-nav .item .lbl { font-size: 10.5px; font-weight: 600; }
  .m-nav .item.on { color: var(--primary); }
  .m-nav .item.on::before { content: ""; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 3px; height: 3px; }

  /* FAB：实色 primary + 6px 圆角 */
  .fab {
    position: absolute; right: 16px; bottom: 86px;
    width: 52px; height: 52px; border-radius: var(--r-card);
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--raised-shadow); cursor: pointer;
    transition: transform .12s ease;
  }
  .fab:active { transform: scale(0.94); }
  html[data-theme="dark"] .fab { color: #06281D; }

  /* 快速捕获底部弹层：实色 raised + 顶部 8px 圆角 + 把手 */
  .sheet-mask { position: absolute; inset: 0; background: rgba(0,0,0,.32); display: flex; align-items: flex-end; }
  .sheet {
    width: 100%; background: var(--raised);
    border-top: 1px solid var(--panel-border);
    border-radius: var(--r-sheet) var(--r-sheet) 0 0;
    box-shadow: var(--raised-shadow);
    padding: 10px 16px 22px;
    animation: sheetUp .28s cubic-bezier(0.2, 0, 0, 1) both;
  }
  @keyframes sheetUp { from { transform: translateY(60%); opacity: .5; } to { transform: translateY(0); opacity: 1; } }
  .sheet .handle { width: 36px; height: 4px; border-radius: 2px; background: var(--divider); margin: 4px auto 14px; }
  .sheet h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .quick-types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .qtype { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: var(--r-btn); background: var(--subtle); border: 1px solid transparent; cursor: pointer; transition: all .12s ease; }
  .qtype:active { transform: scale(.96); }
  .qtype span { font-size: 11px; color: var(--ink-muted); }
  .qtype.on { background: color-mix(in srgb, var(--primary) 10%, transparent); border-color: color-mix(in srgb, var(--primary) 30%, transparent); }
  .qtype.on span { color: var(--primary); }
  .qtype .ic-box { width: 32px; height: 32px; border-radius: 8px; background: var(--surface); border: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .qtype.on .ic-box { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 40%, transparent); }

  .m-card { padding: 12px; margin-bottom: 10px; }
  .m-habits { display: flex; align-items: center; gap: 8px; padding: 11px 12px; border-bottom: 1px solid var(--divider); }
  .m-habits:last-child { border-bottom: none; }
</style>
</head>
<body>

<header class="preview-bar">
  <div class="brand"><span class="dot"></span>DESIGN V2 · 翠绿·锐意</div>
  <nav>
    <a href="index.html">令牌总览</a>

  </button>
</header>

          <div style="flex:1"><b style="font-size:12.5px;display:block">今日尚未日结</b><span style="font-size:11px;color:var(--ink-muted)">21:30 后开放</span></div>
          <button class="btn outline sm" style="height:26px;font-size:11.5px">清单</button>
        </div>
      </div>
      <div class="m-nav">
        <div class="item on"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg><span class="lbl">今日</span></div>
        <div class="item"><svg class="ic" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span class="lbl">任务</span></div>
